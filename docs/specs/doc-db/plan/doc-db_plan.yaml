    priority: 92
    status: pending
    design_id: DES-057
    depends_on: []
    group_id: null
    build_check: per_task
    description:
      - DES-057 §4.1 に従い KEY・series・対象文書一覧を解決する
      - worktree 間で KEY が分裂しない解決方法を用いる
      - series 取得不能および detached HEAD の扱いを §4.1 の表に合わせる
      - 対象文書の解決は既存の doc-structure resolver を再利用し、YAML パーサを二重実装しない
      - 対象文書数を呼び出し側が取得できる形で返す（§4.2 の 0 件先判定に使う）
      - 単体テストで §9.1 の該当項目を検証する
    acceptance_criteria: 同一リポジトリの異なる worktree で同一 KEY が得られ、detached HEAD で規定の series が返る。対象 0 件と 1 件以上を呼び出し側が区別できる
