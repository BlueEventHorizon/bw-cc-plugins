tasks:
  - task_id: TASK-001
    title: docdb_client.py と応答注入 fixture の実装
    priority: 95
    status: completed
    design_id: DES-057
    depends_on: []
    group_id: null
    build_check: per_task
    description:
      - DES-057 §2.2 に従い MCP session 確立と JSON-RPC 送信を実装する
      - JSON 応答と SSE 応答の両方を解析する
      - 移植元から forge が使う 3 tool 相当の操作へ縮小する（§4.5 の tool 表）
      - 通信定数は §2.2 の値を用いる
      - HTTP 送信を 1 つの関数境界に閉じ、テストから差し替え可能にする（§9.1）
      - 応答注入用 fixture（JSON / SSE / tool error / HTTP error）を tests 側に用意する
      - socket を開く fake server は作らない（§9.3）
      - 単体テストで §9.1 の該当項目を検証する
    acceptance_criteria: 注入した JSON 応答と SSE 応答が同一の parse 結果を返し、tool error と HTTP error が区別して返る。既存テストスイートが全通過する
    required_reading:
      - docs/specs/doc-db/plan/doc-db_strategy.md
      - docs/specs/doc-db/design/DES-057_doc_db_backend_selection_design.md
      - docs/rules/implementation_guidelines.md
  - task_id: TASK-002
    title: docdb_runtime.py の実装
    priority: 93
    status: pending
    design_id: DES-057
    depends_on:
      - TASK-001
    group_id: null
    build_check: per_task
    description:
      - DES-057 §2.3 に従い接続 probe と on-demand 起動を実装する
      - 起動後の再接続を期限付きで再試行する
      - 実行ファイル不在・プロセス起動失敗・早期終了・再接続不能を理由コードとして返す
      - プロセスの生死ではなく MCP 接続の成否で利用可否を判定する
      - forge 側でログファイルを生成しない
      - 認証情報を読む処理・出力する処理を持たない（NFR-005）
      - 単体テストで §9.1 の該当項目（4 異常系と秘密値非出力）を検証する
    acceptance_criteria: 4 つの異常系がそれぞれ固有の理由コードで返り、出力に認証情報・環境変数値・設定本文が含まれないことをテストで確認できる
    required_reading:
      - docs/specs/doc-db/plan/doc-db_strategy.md
      - docs/specs/doc-db/design/DES-057_doc_db_backend_selection_design.md
      - docs/rules/implementation_guidelines.md
  - task_id: TASK-003
