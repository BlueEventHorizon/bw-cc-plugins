  plugins/forge/docs/adr_principles_spec.md:
    title: Architecture Decision Record Operating Principles
    purpose: Defines principles for creating, updating, and using Architecture Decision Records to record design decisions and their rationale, guiding when ADRs should be written and how to maintain them.
    content_details:
      - "Definition of ADRs: records of design decisions, rationale, and alternatives"
      - "Criteria for writing ADRs: only when future proposals are likely and cannot be deduced from code/rules/specs"
      - "Content restrictions: exclude specifications, rules, code-evident decisions, and task logs"
      - "Immutable elements: section numbers cannot change due to external references in code and tests"
      - "Superseded decisions: mark with failure markers when new ADR overrides old decision"
      - "Decision reversal principles: use two-condition test to choose between new ADR versus appending to existing"
      - "Rejection reason writing: use future proposal vocabulary, not implementation-specific terms"
      - "Rejection reason foundations: explicitly state assumptions underlying rejections"
      - "Discovery of obsolescence: confirm during specification changes whether new changes invalidate existing ADR rejection premises"
    applicable_tasks:
      - ADR creation and maintenance
      - Design decision documentation
      - Proposal evaluation and rejection reasoning
      - Architecture review for decision consistency
      - Design change impact assessment on existing decisions
      - Code review for design decision compliance
