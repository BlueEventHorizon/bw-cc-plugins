  plugins/forge/docs/version_migration_spec.md:
    title: Version Migration Implementation Specification
    purpose: Specifies pipeline-based data format migration with versioned stages, error handling strategies, and rollback on failure for implementing incremental schema evolution
    content_details:
      - "Pipeline principle: sequential migration through intermediate versions"
      - "Migration function contracts: single input/output, idempotence, no side effects, non-destructive"
      - "Error handling: rollback to pre-migration state, skip unknown versions, treat missing version as v1"
      - "Registry pattern: CURRENT_VERSION constant and MIGRATIONS dict keyed by target version"
      - "Version detection: self-descriptive format with version in YAML comments or JSON fields"
      - "New version addition procedure: implement function, register in MIGRATIONS, update CURRENT_VERSION, do not modify existing functions"
      - "Test requirements: direct migration, multi-stage migration, idempotence, error rollback, future version skip, version detection failure"
