  plugins/forge/docs/adr_principles_spec.md:
    title: ADR (Architecture Decision Record) Operating Principles
    purpose: Defines the operating principles and norms for creating, modifying, and using Architecture Decision Records to record decision rationale and prevent redundant proposals
    content_details:
      - "Purpose and beneficiary: ADR records alternative options and rejection reasons for future proposers"
      - "Content scope: decision rationale and alternatives, not specifications or rules which have separate documentation"
      - "Creation criteria: two simultaneous conditions - future proposal likely and decision not inferable from code/rules/specs"
      - Optional scope block for clarifying decision boundaries when multiple ADRs address same target
      - "Mutability with tracked reversions: update content and record reversions (A → B → A) but never change section numbers"
      - "Decision reversal: create new ADR if satisfying criteria; otherwise append revision to existing section"
      - "Expiration handling: mark only when superseded by another ADR, retaining original section as context"
      - "Rejection rationale methodology: use future proposal terminology and explicit dependent premises for change detection"
