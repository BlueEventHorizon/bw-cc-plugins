  plugins/forge/docs/scope_proportionality_spec.md:
    title: Scope Proportionality Specification
    purpose: Defines the principle and decision gate for evaluating whether to adopt countermeasures (fixes, features, defensive implementations) for catastrophic failures or theoretical risks, preventing system bloat while maintaining practical safety
    content_details:
      - "Purpose: Prevents unlimited accumulation of countermeasures for theoretically possible failure scenarios"
      - "Three applicable types for proportionality check: catastrophic external factors, speculative defensive implementation, unsupported quality improvement"
      - "Types NOT subject to check: explicit requirement/design/rule violations, specific runtime risks, data loss/security/destructive operations"
      - "Catastrophic external factors scope: OS-level failures, filesystem corruption, disk exhaustion (outside normal operations)"
      - "Three-point check: trigger doesn't break other prerequisites, existing safety net prevents harm, cost-benefit balance is justified"
    applicable_tasks:
      - Code review decision making for edge case handling
      - Evaluating defensive implementation proposals
      - Determining fix adoption for speculative protection
      - Preventing overengineering in design review
