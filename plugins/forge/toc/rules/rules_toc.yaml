  plugins/forge/docs/spec_design_boundary_spec.md:
    title: Specification and Design Boundary Guide
    purpose: Clarifies the boundary between requirements (What) and design (How) through judgment criteria, category-specific guidelines, and severity catalog to ensure correct document classification.
    content_details:
      - "Core principles: requirements specify What from user perspective; design specifies How from developer perspective"
      - "Primary criterion: Would this appear in user manual? Yes → requirements; No → design"
      - "Supplementary criteria: implementation-independence, technology specificity, class/method names, How-question answers"
      - "Judgment flowchart: user manual → technology specificity → implementation-independence decision path"
      - "Data categories: data types and content in requirements; Service→DataStore→ViewModel flow and stream implementation in design"
      - "State categories: visible states like loading/error in requirements; ViewState enum and state management implementation in design"
      - "Business rules: rule content and conditions in requirements; validation implementation algorithm in design"
      - "Quantitative targets: confirmed business or contract targets in requirements; achievement strategy and structure in design; never guarantee outcomes at design stage"
      - "Gray zone allowances: conceptual and implementation types acceptable in requirements; user diagrams in requirements; internal sequence/data flow/class diagrams in design"
      - "Traceability norm: design references requirement IDs in metadata; no design-only feature additions; no isolated references"
    applicable_tasks:
      - Specification and requirements document authoring
      - Design document authoring
      - What/How boundary validation in reviews
      - Spec/design traceability verification
      - Scope creep detection and prevention
      - Quantitative target handling and placement
      - Diagram classification and placement
      - Gray zone judgment for data types and diagrams
