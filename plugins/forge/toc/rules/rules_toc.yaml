  plugins/forge/docs/design_principles_spec.md:
    title: Design Document Creation Principles
    purpose: Establishes principles, mandatory structure, content guidelines, and judgment criteria for creating and maintaining design documents that specify implementation methods rather than requirements
    content_details:
      - "Basic policy: Design documents specify How (implementation), not What (requirements)"
      - "Mandatory structure: Module list table, Component/Class diagram, Use case list, Sequence diagram"
      - "Required content: Implementation methods (class/method names), technical details with rationale, processing flows, data flows, test case design, existing component usage paths"
      - "Prohibited content: Excessive source code, framework specification without rationale, out-of-scope features, guaranteed performance numbers, AI-guessed quantitative targets"
      - "Quantitative target handling: Design documents present structure and approach but do not guarantee achievement; validation deferred to load testing and profiling"
      - "Implementer judgment criterion: Can the implementer implement from this? Yes → include, No → more detail needed"
      - "Hierarchical structure guidelines: Split large designs exceeding 500 lines; child designs reference parent ID; parent lists children"
      - "File naming convention: {DesignID}_{target_name}_design.md using snake case"
      - "Optional sections: Data flow design, state management, error handling, performance, security considerations"
      - "No historical records: Use CHANGELOG and ADR for change history, not design document"
    applicable_tasks:
      - Design document creation and authoring
      - Design document review and validation
      - Design update when implementation diverges
      - Architecture pattern and dependency direction review
      - Component responsibility definition and cohesion review
      - Availability and SPOF resilience design
