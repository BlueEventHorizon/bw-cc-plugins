    purpose: Defines review perspective priorities (P1/P2/P3), severity relationship, and delegation model for forge review criteria and principles, establishing mandatory policy for /forge:review SKILL
    content_details:
      - "Three review priority levels: P1 rule compliance, P2 contradiction detection, P3 unnecessary complexity"
      - "P1 definition: checking target against project rules, forge built-in rules, related specifications"
      - "P2 definition: detecting contradictions within/across documents; exclusion of incompleteness detection"
      - "P3 definition: Yes/No evaluation of simpler alternatives; exclusion of subjective evaluation"
      - "Priority and severity independent axes: priority indicates detection source (P1/P2/P3), severity indicates fix urgency (critical/major/minor)"
      - "Severity SoT delegated to principles' severity catalog, not declared in review_criteria"
      - Severity mapping table for document reference violations (3-8) mapping to critical, major, minor levels
      - "Exclusion rules: P2 excludes incompleteness, P3 excludes subjective evaluation, custom perspectives prohibited"
      - Proportionality check for fix adoption using scope_proportionality_spec with 3 concern types
      - "Fixed 3-section structure for review_criteria files: SSOT reference, check order, decision rules"
