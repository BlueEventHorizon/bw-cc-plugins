  plugins/forge/docs/spec_priorities_spec.md:
    title: Specification and Design Document Priorities
    purpose: Defines structural design principles that must be prioritized, prohibited main goals, typical anti-patterns, and judgment criteria for requirement and design document creation and review
    content_details:
      - Structural design principles (responsibility division, boundary setting, dependency direction) are Yes/No checkable and must be prioritized
      - Quality characteristics (maintainability, operability, testability) are results of structural principles, not direct targets (Goodhart law)
      - "Prohibited: quantization of structural quality (baseline → re-measure pipelines, flag counts, class line limits)"
      - "Prohibited: direct quantization of quality characteristics (change ease, operability, testability)"
      - "Prohibited: progress management KPI, achievement rates, evaluation table aesthetics as design goals"
      - "Prohibited: AI invention of undefined quantitative values from examples"
      - "Typical anti-patterns: structure improvement translated to quantized targets, evaluation table aesthetics, post-review value fabrication"
      - "Typical anti-patterns: direct quantization of changeability, AI completion of post-execution sensory values"
      - Four self-check questions for design judgment (Yes/No decidability, quality characteristics mapping, measurement motivation, stakeholder confirmation)
      - Severity catalog (critical, major) for 15 violation types across structural principles and anti-patterns
      - Gray zone tolerance ranges for quantization (functional vs structural metrics, confirmed vs unconfirmed values, evaluation axes, measurement description, coverage targets)
      - Non-functional requirement categories (performance, availability, security, operability) with severity scoping by system type
    applicable_tasks:
