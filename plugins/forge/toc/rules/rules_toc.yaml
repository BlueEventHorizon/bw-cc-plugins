  plugins/forge/docs/consult_principles_spec.md:
    title: Consult Presentation Principles
    purpose: Specifies principles for AI to follow when requesting judgment or discussion from humans, ensuring clear, structured, and context-aware presentation in console-based interactions
    content_details:
      - State background and essence before presenting choices
      - Use agenda tables to track multi-item decisions with progress and outcomes
      - Present single recommendation with reasoning; avoid hiding conclusions
      - Use confidence marking symbols to distinguish confirmed facts from assumptions
      - Restate key points when referencing previous discussions to avoid reader search
      - Keep console output concise, combining background, essence, recommendation in 10 lines
      - Avoid forcing judgments in discussion contexts; stop at explanation only
      - Present options clearly with what each does, what changes, and single recommendation
