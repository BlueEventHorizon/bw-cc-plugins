  plugins/forge/docs/spec_design_boundary_spec.md:
    title: Specification and Design Document Boundary Guide
    purpose: Defines the boundary between What (requirements specification) and How (design document) to support judgment on where to record content, based on user perspective, implementation detail level, and manual applicability.
    content_details:
      - "Basic principles: What is user-perspective/conceptual/technology-neutral, How is developer-perspective/implementation-level/technology-dependent"
      - "ADR relationship: design documents record current design with brief rationale; ADRs record decision reasoning without transcribing design itself"
      - "Initial decision criterion: is topic already decided with no choice? Yes=write concretely in requirements, No=use main criterion"
      - "Main decision criterion: would it appear in a user manual? Yes=requirements, No=design"
      - "Quantitative goals distinction: confirmed targets in requirements, policies to achieve in design, guarantees forbidden in both, verification results post-operation"
      - "Function value and existence reason: value of features belongs only in requirements, not design or as design guarantees"
      - "Data model typing: concept and implementation types allowed in requirements, detailed type design belongs to design"
      - "Diagrams: user-facing diagrams (screens, navigation, use cases) in requirements, internal diagrams (sequence, dataflow, class) in design"
      - "Traceability and scope: design requirements must exist in specification, out-of-spec features require approval ADR, differential development refers to differential-side spec"
    applicable_tasks:
      - Requirements and design boundary determination
      - Design document review for boundary compliance
      - Requirement writing and validation
      - Design document validation
      - Traceability verification
      - Scope change and out-of-spec feature evaluation
    keywords:
