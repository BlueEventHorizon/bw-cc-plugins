  plugins/forge/docs/scope_proportionality_spec.md:
    title: Scope Proportionality Specification
    purpose: "Establishes principles for determining whether defensive measures, optimizations, and quality improvements should be adopted, preventing over-design by narrowly gating defensive implementations. Applies only to three categories: catastrophic external defense, speculative defense, and unmotivated quality improvements."
    content_details:
      - "Three categories requiring proportionality check: catastrophic external factors defense, speculative defense without concrete occurrence path, quality improvements without design/requirement basis"
      - "Out-of-scope exemptions: explicit requirement/design/rule violations, concrete runtime risks with reproduction steps, data loss/security/destructive operations/test-required problems"
      - "Discovery in review is not an applicable category: normal reviews find bugs through this path; 'found in review' doesn't justify skip on proportionality grounds"
      - "Catastrophic external factors definition: OS-level crashes, filesystem corruption, disk failure, hardware failure (defense only if explicitly requested)"
      - "Verification impossibility principle: catastrophic scenarios cannot be verified in normal operations; pointless to accumulate defensive code without real verification capability"
      - "First check point: trigger condition doesn't break other prerequisites (e.g., atomicity alone cannot protect against process crash)"
      - "Second check point: failure is already caught by independent safety net (type checking, CI, other layer validation) before harm occurs"
      - "Third check point: cost of countermeasure must match actual preventable damage (theoretical possibility is insufficient)"
      - "Safety net definition: must be type checking, CI, validation layers - not 'found in review' itself"
      - "Ambiguity fallback: when applicability is unclear, treat as not applicable (avoid false positive skip of valid findings)"
    applicable_tasks:
      - Code review finding severity assessment for defensive implementations
      - Proportionality check for suggested fixes and quality improvements
      - Catastrophic failure scenario risk assessment
      - Safety net validation (type checking, CI, validation layer coverage)
      - Over-design prevention in implementation reviews
      - Speculative defense evaluation and cost-benefit analysis
