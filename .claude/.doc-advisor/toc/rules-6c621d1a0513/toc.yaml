      - "Anti-pattern: querying forge internal docs (redundant, fixed path available)"
      - "Anti-pattern: hardcoding project spec paths in SKILL.md (paths rot, maintenance cost explosion)"
      - "Anti-pattern: placing forge internal procedural logic in documentation (docs declarative, procedures in SKILL/scripts)"
      - "Anti-pattern: passing session_dir to agents and using file-based result transfer (use agent return values)"
