  docs/rules/document_writing_rules.md:
    title: Document Writing Rules
    purpose: Establishes consistent formatting, terminology, structure, and style standards for all project documentation to ensure readability for both AI and human readers
    content_details:
      - "Heading and tag conventions: [MANDATORY] for absolute rules, [CRITICAL] for violations causing serious issues, [IMPORTANT] for caution items; tags must be placed at end of heading line with exactly 1 space before tag; limit 0-3 tags per document to maintain signal effectiveness"
      - "Heading level hierarchy: # for file title (one per file), ## for main sections, ### for subsections, #### for detail items; maximum 4 levels with deeper nesting requiring structure review"
      - "Terminology standardization rules: replace non-recommended terms with recommended ones (必読文書 to 必須参照文書); use hyphenated section naming (共通 - 必須参照文書); use English emphasis phrases (NEVER skip, MUST, DO NOT, ALWAYS) for maximum AI effectiveness"
      - "Japanese long-vowel abbreviation rule following JIS Z 8301 standard: abbreviate final long vowels (ディレクトリ not ディレクトリー, カテゴリ not カテゴリー) except for official framework names and fixed proper nouns"
      - "Document structure templates by type: workflow documents require frontmatter with name/description/applicable_when plus sections for required references, overview, procedure steps; rule documents require basic principles, detailed rules, exceptions sections"
      - "Cross-reference principle: write references only when necessary for understanding or verifying main claims; exclude metadata sections listing related documents; follow forge document_style_guide system (3) for same-project references"
      - "Document nature separation: docs/rules (project rules and guidelines), docs/specs (requirements and design documents), plugins/*/docs (plugin internal specifications), .claude/skills (local non-distributed skills), plugins/*/skills (distributed marketplace skills)"
      - "Current state only rule: write only present-state content in document body; exclude transition narratives, change histories, and obsolete references; place all history in CHANGELOG.md and design decisions in ADR"
      - "Abstract placeholder system for docs/rules documents: use generic placeholders (Foo, Bar, Hoge, Fuga) not project-specific names; use business terms (item, category, field) not project entities"
      - "Formatting standards: language-tagged code blocks, lists nested maximum 2 levels, tables with maximum 6 columns, inline code for filenames and variables, strong for keywords, markdown emphasis for visual distinction"
    applicable_tasks:
