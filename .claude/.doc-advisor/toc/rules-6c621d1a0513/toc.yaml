  docs/rules/claude_code_reference.md:
    title: Claude Code Reference (SKILL / Plugin / Agent)
    purpose: Provides factual information on Claude Code mechanisms (launch paths, agent types, tool restrictions) and repository definitions needed for combining SKILLs and Agents in forge/anvil platforms
    content_details:
      - "Five launch paths with short names: inherited SKILL (Skill tool, parent context, in-process output), fork SKILL (Skill with context:fork, isolated context, return value only), generic Agent (built-in Agent tool, isolated context, completion notification), custom Agent (plugin:name Agent tool, isolated context, completion notification), Bash subprocess (external process, no handbook, exit code/stdout)"
      - "Fork SKILL bugs documenting seven public Issues preventing fork adoption: #18394 context fork ineffective, #34164 ARGUMENTS substitution in nested fork SKILL, #60720 Desktop UI output failure, #55592 infinite recursion fixed in v2.1.145, #34328 subagent creation failure, #19751 AskUserQuestion broken in fork, #17351 nested SKILL returns to main not caller"
      - "Subagent_type value domain limited to: built-in Agent names (general-purpose, Explore, Plan, claude, statusline-setup, claude-code-guide), plugin-scoped custom Agent names; invalid: SKILL names, slash notation like /<plugin>:<skill>, file paths"
      - "Tool restriction scope: allowed-tools grants single-turn pre-approval cleared on next user message; disallowed-tools restriction also clears on next message making multi-turn dialogue ineffective"
      - "Agent launch mode determined by hierarchy: in-process agent team teammate (foreground), CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1 (foreground), fork mode ON (background default in interactive), fork mode OFF (background unless result needed)"
      - SKILL frontmatter provides no launch mode specification; Agent definition background:true only applies in fork mode OFF
      - ScheduleWakeup is /loop dynamic mode tool only for resume scheduling; background task completion uses harness notification instead
      - "Source citation method distinguishes: public (URL and official docs quote), observed (empirical testing), public Issue (GitHub issue reference); mark investigation date, version, and Anthropic response status (fixed, not planned, open)"
      - "Machine-readable subset: skill_launch_terms.toml validates other-skill invocation paths; update together with reference document"
      - "Authority hierarchy: Claude Code official behavior has source citation, repository definitions require no citation, SKILL author guidance lives in separate document"
    applicable_tasks:
      - Selecting appropriate launch path between inherited SKILL, fork SKILL, generic Agent, custom Agent, and Bash subprocess
      - Evaluating fork SKILL viability given documented public Issues and Anthropic non-fix decisions
      - Validating subagent_type values against allowed built-in and custom Agent names
      - Understanding tool restriction scope for security allowlist implementation
      - Designing Agent background task completion notification handling
      - Tracking Claude Code version changes and mechanism status updates
      - Reviewing SKILL context isolation requirements against launch path options
    keywords:
