  docs/rules/implementation_guidelines.md:
    title: Implementation Guidelines
    purpose: Defines mandatory implementation, testing, asset placement, distribution-boundary, fallback, ToC, and version-management rules for plugin scripts and SKILL.md files.
    content_details:
      - Python is required for structured data work, Bash for command and file orchestration, with PyYAML as the sole permitted Python dependency
      - Python scripts under plugins require tests organized by plugin and skill; SKILL.md and local .claude assets are exempt
      - Processing logic must live in standalone scripts instead of inline code inside SKILL.md
      - Skill-specific assets stay under the owning skill, while assets shared by multiple skills move to plugin-level scripts or docs directories
      - Distributed user-facing assets must not reference repository development documents by concrete path or specification ID
      - Distribution rules may be embedded at the reference site or placed in shared plugin documentation with prescribed reference forms
      - Unused production and test code must be deleted rather than deprecated or commented out
      - Natural-language user input must be interpreted by AI rather than rigid script parsers
      - Fallbacks require a demonstrably correct recovery contract; otherwise failures must be reported explicitly and structurally fixed
      - Feature work must not edit version files, changelogs, or tags; version updates belong exclusively to forge:update-version
    applicable_tasks:
      - Implementing or reviewing plugin Python and Bash scripts
      - Creating or modifying SKILL.md files and bundled documentation
      - Organizing shared and skill-specific plugin assets
      - Reviewing distribution-boundary references in user-facing plugin content
      - Designing error recovery and fallback behavior
      - Adding or relocating plugin script tests
      - Regenerating and committing document ToC indexes
      - Preparing feature, fix, or refactor pull requests without version changes
    keywords:
      - SKILL.md
