  docs/rules/implementation_guidelines.md:
    title: Implementation Guidelines
    purpose: Defines development guidelines for implementing plugin scripts (Python/Bash) and SKILL.md files, covering language selection, testing requirements, code organization, and distribution boundaries
    content_details:
      - "Script language selection: Python for data transformation and YAML/JSON operations; Bash for external commands and file operations; PyYAML as sole permitted external library"
      - "Testing requirements: plugins/*.py scripts require unit tests; Bash scripts require integration/manual testing; SKILL.md exempted as AI-interpreted behavior; .claude/ directory excluded"
      - Test directory structure under tests/{plugin_name}/{skill_name}/ with test_{module}.py naming convention matching skill directory names
      - "SKILL.md inline script prohibition: process logic must be external scripts called via environment variables, never embedded in SKILL.md"
      - "Script and document placement rules: skill-specific assets under skills/{skill}/, shared assets under plugins/{plugin}/ based on reuse count"
      - "Cross-skill direct reference prohibition: other skill's docs cannot be hardcoded; multi-skill dependencies must be elevated to plugins/{plugin}/docs/"
      - "Design document maintenance via ADR: placement at docs/specs/{plugin}/design/ADR-{NNN}_{topic}.md following forge design principles"
      - "Distribution boundary rule: plugins/ code cannot reference docs/ project documents (neither path-based nor ID-based); use dynamic query via /forge:query-db-specs and /forge:query-db-rules"
      - "Unused code deletion: non-deprecated markers or commented code prohibited; git history preserves recovery path"
      - "Version management: feature/fix/refactor PRs must never edit version-related files; only /forge:update-version handles version updates"
