  docs/rules/version_migration_design.md:
    title: Version Upgrade and Migration Design Rules
    purpose: Defines design principles (pipeline, idempotency, forward compatibility) and anti-patterns for implementing safe multi-step version migrations across config files, Swift models, and databases.
    content_details:
      - "Anti-pattern: reading old-version data directly without migration causes missing keys to resolve to None"
      - "Anti-pattern: passing fixed original data to every migration step instead of chaining outputs (found in DocAdvisor v4.x multi-step migration)"
      - "Pipeline principle: each migration function takes the previous step's output as input, enabling safe skip-version migration (v4 to v6)"
      - "Single Source of Truth principle: manage version number in one place and embed it in the data itself (self-describing)"
      - "Idempotency principle: migrations must produce the same result when applied twice (e.g. ALTER TABLE ADD COLUMN IF NOT EXISTS)"
      - "Forward compatibility principle: migration functions must preserve unknown keys instead of deleting them"
      - "Applied-history persistence principle: record which version has been applied for re-run prevention and diagnostics"
      - "YAML/JSON migration pattern: MIGRATIONS registry table and apply_migrations() pipeline function"
      - "Swift Codable versioned struct pattern: per-version structs with migrateToLatest() dispatch by version number"
      - "SQL migration pattern: numbered migration files (Rails/Flyway/Alembic style) with schema_migrations history table and transactional apply_db_migrations()"
    applicable_tasks:
      - Designing config/schema version migration logic
      - Reviewing multi-step (version-skipping) migration implementations
      - Implementing idempotent SQL schema migrations
      - Implementing Swift Codable versioned struct migrations
      - Designing .doc_structure.yaml version upgrade and migration
      - Pre-release version upgrade checklist review
    keywords:
      - migration
