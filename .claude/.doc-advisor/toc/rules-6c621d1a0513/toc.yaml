  docs/rules/script_error_output_rules.md:
    title: Script Error Output
    purpose: Defines exit code conventions and output format requirements for Python scripts in the plugins directory, establishing how scripts declare exit codes and callers interpret results.
    content_details:
      - Exit code conventions (0 for success, 1 for generic failure, 2 for argparse errors, 3+ for script-specific)
      - Mandatory docstring declaration tables for exit codes 3 and above
      - Decentralized exit code meanings owned by each script, not a central registry
      - Caller behavior rules based on exit code declarations from producer
      - JSON output format for both success results and error responses
