  docs/rules/version_migration_design.md:
    title: Version Migration Design Rules
    purpose: Defines design patterns and best practices for implementing safe, reliable version migrations across configuration files, databases, and data structures to handle major version updates
    content_details:
      - "Why migrations are needed: key renaming, structure changes (flat to nested), type changes (numeric to string), key additions and deletions"
      - "Anti-patterns to avoid: reading old data directly without conversion, using fixed original data in multi-step migration (DocAdvisor v4-v6 issue example)"
      - "Pipeline principle: each migration step receives output of previous step, enabling safe version skips (v4 to v6 through v5)"
      - "Five core principles: pipeline pattern, single source of truth for version numbers, idempotency (same migration applied twice yields same result), forward compatibility (preserve unknown keys), migration history logging"
      - "YAML/JSON implementation: MIGRATIONS dictionary with versioned functions (fn(dict)->dict signature), apply_migrations loop passing current output forward"
      - "Swift Codable/PropertyList: versioned struct types, VersionedData wrapper with version number, migrateToLatest() switch statement for step-by-step conversion"
      - "Database pattern: numbered migration files, schema_migrations history table for tracking applied versions, transaction wrapping for rollback safety"
      - "Version skipping logic: filtering migrations where current_version<v<=target_version, with sorted() ordering"
      - "Pre-release checklist: design verification, implementation verification, multi-stage testing including skip-version tests (v4→v6), idempotency tests"
