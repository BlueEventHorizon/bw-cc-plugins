  plugins/forge/docs/scope_proportionality_spec.md:
    title: Proportionality Principle (Over-Design Prevention)
    purpose: Defines a general principle for deciding whether to adopt interventions (fixes, new features, defensive implementations) by limiting unnecessary mitigation of theoretical abnormalities to prevent system bloat
    content_details:
      - Prevents unlimited accumulation of mitigations for theoretical abnormalities
      - "Three finding types where proportionality check applies: Catastrophic external factors, speculative defensive implementations, subjective quality improvements without design/requirement/rule basis"
      - "Findings NOT subject to proportionality check: Explicit requirement/design/rule violations, concrete runtime risks, data loss/security/destructive operations"
      - "Out-of-scope catastrophic factors: OS-level abnormalities, filesystem corruption, disk exhaustion, hardware failures when system itself is broken"
      - "Three-point check requirement 1: Trigger condition doesn't break other independent premises"
      - "Three-point check requirement 2: Existing independent safety nets (type checking, CI, other-layer validation) prevent harm"
      - "Three-point check requirement 3: Cost/benefit ratio justified with concrete failure path"
      - Review discovery itself is NOT an independent safety net and cannot justify adoption
      - "Ambiguity resolution: Assume NOT applicable to avoid false positive of skipping valid findings"
      - "Unclear categorization treated as normal fix path per criteria's own rules"
    applicable_tasks:
      - Review finding evaluation and gatekeeping
      - fix adoption decision logic
      - Over-design prevention in feedback
      - Defensive implementation justification
      - Speculative proposal filtering in reviews
    keywords:
      - proportionality
      - over-design
      - catastrophic
      - external factors
      - defensive implementation
      - safety net
      - fix adoption
      - three-point check
      - scope limitation
      - risk assessment
  plugins/forge/docs/sensitive_information_spec.md:
    title: Sensitive Information Leakage Prevention
    purpose: Defines information that must not be included in repositories and judgment criteria for detecting leakage. Establishes that mixed-in secrets are treated as leaked regardless of deletion, requiring invalidation/reissue
    content_details:
      - Mixed-in secrets treated as leaked regardless of deletion/rewrite due to git history, forks, CI logs, mirrors, local clones
      - Regulation is not find-and-delete but invalidate-and-reissue of secrets
      - "Authentication secrets: API tokens, private keys, passwords, connection strings, session/signed values"
      - "Non-secrets but dangerous if public: Internal hostnames, PII, customer identifiers, production resource names"
      - "Permitted forms: Environment variable references, explicit placeholders, public-assumption values, invalidated values, format-only descriptions"
      - Example values must use officially reserved examples or 0-padding, never copy real values with partial changes
      - "Two-stage detection: Deterministic scan for known patterns AND AI reading for context-dependent cases"
      - "Suppression marker secrets-scan: ignore can suppress detection but count/position must be reported to reviewers"
      - Never include actual secret values in review requests/findings/logs; use type, location, length, first characters only
