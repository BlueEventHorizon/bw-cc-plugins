  plugins/forge/docs/scope_proportionality_spec.md:
    title: "Principle of Proportionality: Prevention of Over-design"
    purpose: Defines a gate check for deciding whether to adopt design improvements, fixes, or defensive implementations, specifically targeting speculative measures and subjective improvements without explicit requirements or verifiable harm.
    content_details:
      - "Application gate limiting principle to 3 specific issue types: catastrophic external defense, speculative implementations, and subjective improvements without basis"
      - "Three-point precondition checks: trigger condition doesn't break other prerequisites, defensive measure caught by existing safety nets (type checking, CI, validation), cost-benefit proportionality analysis"
      - "Scope exclusion for catastrophic external factors: OS crashes, filesystem corruption, disk full, hardware failures are out of scope unless explicitly requested"
      - "Explicit non-applicability: fixes for explicit requirements, reproducible bugs, data loss, security risks, and MVP-critical issues are always in scope, not subject to gate"
      - "False positive priority: when applicability is ambiguous, treat as regular fix (prioritizes not skipping valid suggestions over preventing false positives)"
    applicable_tasks:
      - Code review decision on fix adoption
      - Feature request and improvement suggestion triage
      - Design review for speculative implementations
      - Issue prioritization and gatekeeping
      - Distinguishing defensive measures with unclear scope from required fixes
