  plugins/forge/docs/spec_priorities_spec.md:
    title: Specification and Design Document Priority Principles
    purpose: Defines universal principles prioritizing structural design factors in requirements and design documents, and prohibits distractions like quantifying structural quality or fabricating undefined numerical targets
    content_details:
      - Structural design principles - responsibility division, boundary setting, dependency direction as top priorities with Yes/No judgment capability
      - Quality characteristics as results of structure - changeability, operability, testability achieved through structural principles, not direct targets
      - "Prohibition on structural quality quantification - no baseline reassessment pipelines, no numerical translation of structural improvements (Goodhart's law)"
      - Prohibition on direct numerical targets for quality characteristics - never use measured metrics like change sites or execution time as primary goals
      - Prohibition on progress KPI and evaluation table appearance manipulation - avoid metrics-driven documentation
      - Prohibition on fabricating undefined quantitative values - AI must not infer undefined metrics from examples; use TBD instead
      - Typical inverted patterns - enumeration of seven past distortions with recognition decision principles
      - Self-questioning criteria - four questions during design judgment to prevent distortions
      - Severity catalog - maps 16 types of violations to critical/major classifications with reasoning
      - Gray zone tolerance ranges - precise allowance for functional goals (performance, availability, business KPI) versus disallowance for structural quality quantification
      - Non-functional requirement category completeness with severity scoping - performance, availability, security, operability coverage based on system nature
      - Perspective-specific usage guide for P1/P2/P3 review observation routing and finding assignment
    applicable_tasks:
      - Specification and design document review for priority principle compliance
      - Structural quality assessment including responsibility division and boundary setting validation
      - Requirements document validation to prevent AI fabrication of undefined metrics
      - Design document review for violation pattern detection and gray zone compliance
      - Non-functional requirement coverage assessment based on system characteristics
      - Numerical target placement validation between requirements and design documents
