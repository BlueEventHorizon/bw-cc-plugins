  docs/specs/forge/design/DES-011_session_management_design.md:
    title: DES-011 Session Management Design
    purpose: "Specifies session lifecycle design for the review pipeline: creation, resumption, deletion, CRUD operations, state machine verbs, and worker coordination"
    content_details:
      - "File-based inter-phase data exchange: sessions as temporary directories where reviewer/evaluator/fixer share refs.yaml and artifacts"
      - "session_manager.py CRUD layer: init creates session.yaml with completed session auto-cleanup, find detects existing sessions, probe judges resumability, touch/resume/complete manage state transitions, cleanup removes directories"
      - "State machine verbs in review_session.py: probe detects interruption, start creates session, resume restores context with next_phase calculation, status aggregates plan.yaml, finish completes and cleans up"
      - "session.yaml structure: common fields (skill, started_at, last_updated, status) followed by alphabetically-sorted skill-specific fields"
      - "Phase state machine: standard phases (created, context_gathering, context_ready, review_running, review_extracted, evaluation_merged, fixing, document_drafting, artifact_ready, completed, failed) track coarse progress"
      - "Session resumption policy: SKILL determines resumability via probe return value; resumable state triggers AskUserQuestion for user choice (resume vs discard)"
      - "Completed session garbage collection: init and probe auto-cleanup status:completed sessions across all skills (Issue #93) with cleanup results reporting"
      - "Session separation from business logic: session management as infrastructure bookend (Phase 0 probe plus Phase 5 finish) distinct from business phases (1-N)"
      - "Worker coordination data flow: reviewer-evaluator-fixer exchange via session_dir files; plan.yaml serves as shared mutable state during evaluation and fixing"
      - "ADR-033 terminology supersession: plan.yaml is pre-ADR-033 name (now findings_state.yaml with findings_<type>.json as source of truth); review_<type>.md is derived view; session lifecycle design unchanged"
