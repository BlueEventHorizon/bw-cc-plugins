      - Update wrappers resolve dirs and exclude patterns from .doc_structure.yaml through prepare_advisor_index.py
      - doc-advisor updates always use dirs mode with dirs-json and exclude-json, leaving directory expansion to expand_dirs.py
      - doc-db updates submit desired-state synchronization and repeatedly report status progress
      - .doc_structure.yaml defines the complete desired state, so omitted paths are removed or detached from the index
