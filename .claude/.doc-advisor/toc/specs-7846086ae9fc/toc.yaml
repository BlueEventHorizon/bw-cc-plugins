  docs/specs/common/design/ADR-055_distribution_boundary_for_doc_references.md:
    title: ADR-055 Prohibit References from Distributed Artifacts to Development Documents
    purpose: Decides that user-facing distributed artifacts must not reference undistributed development documents by path or real specification ID.
    content_details:
      - Two document classes and their asymmetric availability in development and installed environments
      - Ban on all references from distributed artifacts to repository development documents, including direct paths and real spec IDs
      - Abstract placeholder IDs and paths remain allowed because they do not identify real project documents
      - Normative content must be embedded at the reference site or placed in a document shipped within the same distribution unit
      - Scope limited to user-facing SKILL.md, agents, commands, and bundled docs
      - Script comments, docstrings, and developer README files under scripts are exempt
      - Rejected alternatives including shipping development docs, allowing ID citations, broken-link notices, and review-only enforcement
      - Consequences for artifact self-containment, machine detection, provenance loss, and migration of existing references
