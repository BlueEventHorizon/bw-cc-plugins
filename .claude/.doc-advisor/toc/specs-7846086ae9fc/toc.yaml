  docs/specs/common/design/ADR-056_document_reference_necessity_and_notation.md:
    title: ADR-056 Necessity and Notation for Cross-Document References
    purpose: Defines when project documents should reference other documents, the required Markdown link notation, and the exemption for internal links within distributed artifacts.
    content_details:
      - Distinction between document discovery and direct access to a known document
      - Project documents omit references by default and include them only when needed to understand or verify the text
      - Necessary references use relative Markdown links with descriptive labels
      - Plain paths, unlinked filenames, and bare IDs used as navigation are prohibited in project document bodies
      - Related Requirements and Related Designs metadata temporarily retain ID-only dependency records
      - Distributed artifacts are exempt from project-document reference rules because their internal tree is packaged deterministically
      - Internal distribution links do not permit references from distributed artifacts to repository development documents
      - Rejected alternatives covering ID-only references, universal path bans, unrestricted linking, and contract-test-only validation
      - Updated downstream spec-writing guidance preserves qualified IDs only for metadata
