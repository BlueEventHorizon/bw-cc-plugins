    title: "DES-001: Document Search Wrapper Design for Forge-to-Backend Integration"
    purpose: Defines the abstraction, key mapping, output contract, SKILL contract, and doc-advisor forwarding path for Forge rule/spec query and index-update wrappers.
    content_details:
      - Four wrapper SKILLs map rule and specification operations to opaque rules and specs keys
      - Backend order comes from doc_backend.prefer in .claude/.forge.yaml, with doc-advisor preferred by default
      - Query wrappers always update the doc-advisor index before invoking query-docs and never fall back to grep
      - Query results preserve the backend-independent Required documents project-relative path-list contract
      - Query SKILLs and doc-advisor query-docs remain inherited-context dispatchers while read-only query-worker provides isolation
      - Caller arguments are limited to search keywords and a short natural-language task description, excluding parent context and diffs
      - Update wrappers resolve dirs and exclude patterns from .doc_structure.yaml through prepare_advisor_index.py
      - doc-advisor updates always use dirs mode with dirs-json and exclude-json, leaving directory expansion to expand_dirs.py
      - doc-db updates submit desired-state synchronization and repeatedly report status progress
      - .doc_structure.yaml defines the complete desired state, so omitted paths are removed or detached from the index
