      - Use of explicit modes for ordered phases on the same resource when each call is predetermined
      - Restriction of wrappers to the contract required by the owning SKILL instead of exposing all low-level CLI arguments
      - Rejection of universal bans or mandates for flags, positional arguments, subcommands, and script splitting
