  docs/specs/msg-sys/design/ADR-043_msg_sys_msg_review_merge_reversal.md:
    title: ADR-043 Formal Integration of msg-review into msg-sys
    purpose: "Reverses ADR-042 by documenting the decision to formally merge msg-review into msg-sys, providing evidence that the initial separation assumption was incorrect and msg-review was actually msg-sys's core hook implementation"
    content_details:
      - check_inbox.py (msg-review implementation) is production hook implementation replacing bash predecessors, not an application layer
      - Reply hints (FNC-003/FNC-004/BL-001) are general-purpose for any asynchronous inter-agent message exchanges
      - "ADR-042's concern about msg-sys appearing review-specific does not occur in practice"
      - "Root cause: Reply hints only concern Stop hook reason field content, not review-dependent concerns"
      - "Decision: Merge msg-review (REQ-011/DES-040) into msg-sys (REQ-006/DES-034) via /forge:merge-specs"
      - "Update DES-034's Stop hook description from bash implementation to Python implementation"
      - Delete docs/specs/msg-review/ after integration
      - Retain ADR-042 with expiration marker documenting the incorrect premise
