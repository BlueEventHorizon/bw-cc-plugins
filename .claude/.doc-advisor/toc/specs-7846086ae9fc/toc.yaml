    title: ADR-068 Restrict Availability Probes to Deterministic Checks
    purpose: Defines deterministic msg-review availability probing, eliminates screen-inferred responsiveness checks and local self-review fallback, and separates independent prerequisites.
    content_details:
      - ADR-067 requires every review backend to report availability and missing prerequisites before dispatch
      - "Availability is split into independent axes: cmux command availability, running Codex process presence, and inferred responsiveness"
      - Only deterministic cmux availability and direct Codex process detection belong in the availability probe
      - Each deterministic axis uses a separate script so future wake-path changes do not require dismantling combined logic
      - Missing prerequisites are reported individually instead of collapsing them into a generic unavailable result
      - Probes must not affect the reviewer, while backend self-initialization is explicitly allowed before probing
      - Screen-based shell or Claude UI inference from former DES-048 is abolished as unreachable and non-informative
      - Screen reading remains permitted solely as a safety gate before injecting push-wake text
      - Local Claude self-review fallback and its claim/lease machinery are removed because they do not provide independent review
      - Race failures after a successful probe still consume the normal wait budget, with no shortening mechanism
