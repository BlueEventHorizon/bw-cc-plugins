    purpose: Defines architectural decision prohibiting distribution artifacts from referencing external development documents, requiring normative content to be self-contained within the distribution unit or in companion documents
    content_details:
      - Distribution artifacts (plugins/) must not reference development documents (docs/) due to unresolvable references in user environments
      - "Two prohibited reference types: path-direct and spec ID citations"
      - Distinction between actual document references and abstract placeholder examples permitted in specification documents
      - "Approved approach A: include normative content directly in the artifact"
      - "Approved approach B: create companion documents within same distribution unit"
      - "Root cause: environment asymmetry where references resolve in development but fail for users"
      - "Impact: loss of traceability to design decisions but gain of artifact autonomy"
      - Mechanical detection required to prevent regression beyond manual review
