  docs/specs/msg-review/design/ADR-068_availability_probe_determinism_boundary.md:
    title: "ADR-068: Limit Availability Checks to Deterministic Judgment and Abandon Screen-based Liveness Detection"
    purpose: Defines the decision to restrict availability checks to deterministic judgments (tool availability and direct process verification) and to remove heuristic screen-based liveness detection, organizing checks into independent scripts for future extensibility
    content_details:
      - "Context: forge:ADR-067 mandates availability checks on review backends; prior design (DES-048) inferred Codex liveness from cmux screen display"
      - "Decision to separate availability into three axes: A) wake-up tool availability (deterministic), B) session residency via Codex process verification (deterministic), C) response capability via screen inference (heuristic, excluded)"
      - Deterministic checks on axes A and B must be independent scripts enabling future extensibility when wake-up paths change
      - Axis C judgment (screen-based inference) removed because Codex process verification already confirms residency making screen heuristics redundant
      - Insufficient prerequisites returned individually allowing users to understand what to provision
      - Availability checks must not affect remote party when evaluating multiple candidate backends
      - Existing safety gates for push wake-up retained separately; only pre-premise screen inference abolished
      - Local review fallback route removed because it lacks independent context and cannot provide true independent review
    applicable_tasks:
