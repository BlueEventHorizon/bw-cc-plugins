  docs/specs/msg-review/design/DES-045_msg_review_skill_design.md:
    title: DES-045 msg-review Review Backend Design
    purpose: Defines the msg-review backend for persistent Codex review exchanges over msg-sys, including availability checks, messaging, reply delivery, history recovery, and completion handling.
    content_details:
      - "Backend scope separates msg-review transport and response processing from the main review skill's target resolution and finding remediation"
      - Four operating modes cover availability probing, request initiation, response handling, and human-triggered resumption after round-trip limits
      - Protocol headers use [msg-review], review_id, and round to isolate concurrent review histories without adding msg-sys storage columns
      - probe_availability.py initializes hooks before independently checking cmux wake capability, resident Codex process, and msg-sys setup health
      - send_and_await_reply.py structurally combines message sending, cmux push wake-up, and blocking reply wait as the sole path for review messages expecting replies
      - wait_for_reply.py polls with exponential backoff, claims delivery through inbox acknowledgment, and returns delivered_ids to prevent duplicate processing
      - filter_review_history.py extracts one review_id thread and recognizes exact REVIEW_RESULT approved or findings declaration lines from reviewer messages
      - Project root, message database, and resident peer session are treated as one identity; conflicting project-root and db-path inputs fail closed
      - Timeout, malformed reply, send failure, unavailable prerequisites, and round-trip-limit behaviors are explicitly defined without asynchronous fallback
      - Test design covers availability axes, initialization order, acknowledgment races, protocol filtering, send-wake-wait sequencing, and manual Codex integration
    applicable_tasks:
