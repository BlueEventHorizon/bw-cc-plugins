    title: "ADR-043: Formal Integration of msg-review into msg-sys (Reversing ADR-042)"
    purpose: "Documents reversal of ADR-042 separation decision. Clarifies that msg-review was actually msg-sys's primary hook implementation, not an independent application, merging it back into msg-sys specifications"
    content_details:
      - "Context: ADR-042 decided to keep msg-sys and msg-review separate, but implementation contradicted this premise"
      - "Discovery: hooks/check_inbox.py (msg-review implementation) is msg-sys's primary Stop hook implementation"
      - "Evidence: Reply hints feature (FNC-003/FNC-004/BL-001) contains no review-specific logic"
      - "Finding: Reply hints are generic features applicable to any inter-agent asynchronous messaging"
      - Incorrect premise of ADR-042 identified and documented
