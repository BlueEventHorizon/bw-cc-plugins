    title: DES-034 msg-sys Codex Continuous Dialogue Messaging Design
    purpose: Specifies msg-sys architecture for asynchronous inter-agent messaging between Claude and Codex, including stop hook design with reply hints, mailbox implementation, and error handling
    content_details:
      - "msg-sys architecture: sqlite3 append-only mailbox with WAL mode; DB path project-root relative (.claude/.temp/msg-sys/messages.db) not plugin-cache-relative"
      - "Stop hook: unified Python check_inbox.py replaces bash predecessors; switches destination via FORGE_MSG_AGENT_NAME (claude/codex, fail-closed default)"
      - "Reply hints (FNC-003/FNC-004/BL-001): executable command templates added to decision:block using shlex for safe quoting; 3-step procedure (write to temp file, execute send.py with stdin redirect, delete temp file)"
      - "Module design: lib/mailbox.py (persistence), send.py (message send CLI), inbox.py (unread retrieval/ack/mark-notified), check_setup.py (self-diagnostic), lib/notify.py (OS notifications)"
      - "Processing order (critical for safety): validate FORGE_MSG_AGENT_NAME → resolve db_path → inbox.py --next → validate JSON → check round-trip limit → build decision:block in memory → --ack → output JSON only on ack success"
      - "Error handling: 8 processing stages with fail-safe (continue:true when abnormal, no ack if construction fails before step 7, no retransmit after ack success)"
      - "Round-trip limit (FORGE_MSG_MAX_ROUND_TRIPS): chain_length counted via in_reply_to chain; unset environment variable disables auto-continue, requires human notification instead"
      - "Hook registration: forge plugin includes hooks/hooks.json for automatic Claude registration (no manual .claude/settings.json editing); Codex requires manual .codex/hooks.json per worktree with trust registration"
      - "Test coverage: 54 test cases for check_inbox.py, integration validation with Codex, mailbox.ack() ensures first-process-wins exclusion for concurrent stop hooks"
