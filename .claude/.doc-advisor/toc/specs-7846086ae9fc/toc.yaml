    title: DES-049 Review Plugin Separation Design (Migration Plan)
    purpose: Specifies the 2-phase architecture and migration plan to separate review engine (How) from review knowledge (What), enabling beefy plugin independent delivery
    content_details:
      - "2-phase separation strategy: Phase 1 establishes internal plugin boundary in forge; Phase 2 extracts as independent beefy plugin"
      - "What/How principle: forge retains review knowledge (criteria, dispatcher, resolver, normative documents); beefy provides generic review engine"
      - "Plugin cache isolation mandatory: engine cannot reference other plugin cache paths; knowledge transfer via session_dir only"
      - "session_dir contract with new refs.yaml fields: type, mode, packet_version, ssot_refs[].ref_id"
      - "Pre-purification tasks: remove forge domain knowledge from reviewer.md; stabilize criteria ref_id system; audit bi-directional references"
      - "Asset ownership map: beefy receives session/review/fixer scripts, agents, and engine docs; forge retains resolver scripts, criteria, normative documents"
      - "Fail-closed contract validation: ref_id mismatch or duplication causes immediate execution error; packet_version mismatch stops processing"
      - "Risk mitigation: packet_version detector for version skew, explicit error for uninstalled engine, boundary tests for reference integrity"
