    title: "ADR-061: Codex Wake-up Path Multiplexing (Adding app-server Route)"
    purpose: Documents a rejected architectural decision to multiplex Codex wake-up paths by adding app-server route alongside cmux, including technical investigation, alternatives analysis, and impact assessment
    content_details:
      - "Context of wake-up problem: pull-type message detection causes delays in Codex sessions lasting 7+ hours with recurring stops"
      - "Practical measurements of Codex CLI 0.146.0: app-server subcommand, JSON-RPC protocol, WebSocket-over-UDS transport, TUI connection limitations"
      - "Proposed decision: multi-path wake-up with app-server prioritized over cmux, sibling wrapper, Python WebSocket client"
      - "Alternative solutions analyzed: moving wake-up to msg-sys scope, replacing cmux, external dependencies (agmsg), app-server daemon/proxy usage"
      - "Gains: push wake-up in cmux-less environments, eliminates draft destruction risk, protocol self-documentation"
      - "Losses and constraints: Codex launch wrapper required, app-server is experimental interface, Codex-only applicability, unverified TUI prerequisites"
      - "Status: proposed and rejected on 2026-08-02 in favor of ADR-063's independent backend approach"
      - "Relationship to msg-sys: decision does not change msg-sys requirements (REQ-006)"
    applicable_tasks:
      - Codex architectural design review
      - Wake-up mechanism multiplexing strategy
      - Push-type messaging system planning
      - Backend availability and fallback design
      - Alternative solution evaluation
      - Integration with msg-sys framework
