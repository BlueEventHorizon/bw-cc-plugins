  docs/specs/msg-sys/design/DES-034_codex_review_messaging_design.md:
    title: DES-034 msg-sys Codex Continuous Dialogue Messaging Design
    purpose: Specifies the asynchronous messaging infrastructure for bidirectional communication between Claude and Codex sessions using SQLite mailbox, Stop hook implementation, and reply hints with round-trip limiting
    content_details:
      - SQLite3-based append-only mailbox with WAL mode and per-project database isolation
      - Stop hook implementation (check_inbox.py) with FORGE_MSG_AGENT_NAME environment variable controlling Claude/Codex distinction
      - Module design with send.py, inbox.py, history.py, lib/mailbox.py, and lib/notify.py components
      - Reply hint generation using shlex.join() for safe command quoting and executable delivery instructions
      - Eight-stage error flow with fail-safe continue behavior that defers ack until complete construction
      - Round-trip limiting via in_reply_to chain traversal with FORGE_MSG_MAX_ROUND_TRIPS environment variable
      - Dynamic DB path resolution using git rev-parse --show-toplevel for project-root-relative path discovery
      - Human notification mechanism for round-trip limit reached with manual ack command in notification body
    applicable_tasks:
      - Implementing asynchronous messaging between AI agents
      - Designing and integrating Stop hook handlers
      - Setting up message persistence and history tracking
      - Implementing safe reply hint generation
      - Handling error cases with fail-safe behavior
    keywords:
      - msg-sys
