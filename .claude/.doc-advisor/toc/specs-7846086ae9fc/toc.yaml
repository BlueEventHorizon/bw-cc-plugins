    title: "DES-055: Review Request Template Design"
    purpose: Defines backend-neutral natural-language review request templates, placeholder contracts, validation rules, target granularity, and secret-scan trust boundaries for /forge:review.
    content_details:
      - Eight pattern-specific templates cover diff, branch, code, requirement, design, plan, UX/UI, and secrets reviews
