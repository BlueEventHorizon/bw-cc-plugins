      - "Issue document structure: four HTML comment-delimited sections (user-content, artifacts, status, errors) enabling idempotent machine rewriting without modifying user content"
      - "FNC-01 create-issue: Issue creation with kind-specific required sections (Bug/Feature) and Figma reference validation for UI-related Feature Requests"
      - "FNC-02 impl-issue: 14-phase orchestration from Issue trigger through forge skill invocations (requirements, design, plan, implement) to PR creation"
      - "FNC-03 update-issue: Idempotent marker rewriting with three-point hash verification (fetch/pre-edit/post-edit) for concurrent update and render verification"
      - "FNC-04/RuntimeKind: UI vs non-UI Issue classification triggering Figma API integration via prepare-figma and resolve-figma-node"
      - "FNC-05 Figma: Frame ID resolution (REST API) and design spec extraction (MCP) with candidate selection via AskUserQuestion"
      - "Error handling: Five-row matrix covering forge failures, push failures, Figma resolution failures, MCP failures, PR creation failures with recovery strategies"
      - "Security: Credential masking (FIGMA_PAT, gh tokens gho_/ghp_/github_pat_, basic auth URLs) in public channels with regex validation"
      - "Testing: Unit tests for six shared scripts plus integration test scenarios and golden samples"
