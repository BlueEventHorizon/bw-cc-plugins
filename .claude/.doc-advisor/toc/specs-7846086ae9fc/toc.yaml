  docs/specs/msg-review/design/ADR-068_availability_probe_determinism_boundary.md:
    title: ADR-068 Availability Probe Determinism Boundary
    purpose: Defines availability probe boundaries for review backends, restricting checks to deterministic judgment (tool and process presence) while eliminating screen-based inference and local review fallback
    content_details:
      - ADR-067 established availability check requirement; this ADR implements it for msg-review backend
      - Conflict between old DES-048 screen-based inference and new deterministic approach with opposite behaviors
      - "Three judgment axes: A - wake-up tool availability, B - Codex process residence, C - response capability (inference only)"
      - "Decision: include axes A and B in availability check, exclude axis C and old DES-048"
      - "Axes A and B are deterministic reads: cmux command existence and direct Codex process confirmation via cmux top"
      - Axis C inference (shell prompt, Claude Code UI detection) unreliable when Codex process actively running
      - Screen reading for push wake-up safety gate maintained as separate concern
      - Local review pathway discontinued; independent backend with isolated context is better fallback
      - "Rejected alternatives: combined single script, axis C inclusion, maintaining unreached branches"
      - "Impact: deterministic failures confirmed before send, independent premise checks, no dead test paths"
    applicable_tasks:
      - Review backend availability probe implementation
      - Deterministic vs. heuristic judgment boundary decisions
      - Codex session presence verification design
      - msg-review backend error handling architecture
      - Backend prerequisite checking and failure reporting
    keywords:
      - availability probe
      - deterministic judgment
      - cmux
      - Codex process
