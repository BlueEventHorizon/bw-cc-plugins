      - Requirement that wrappers expose only necessary operations and avoid cross-SKILL dependencies
      - Special boundary for inherited SKILL launches where the caller SKILL.md binds literal fixed values
      - Non-goals excluding wrapper minimization, shared wrapper layers, unified dispatchers, and metric-based quality judgments
