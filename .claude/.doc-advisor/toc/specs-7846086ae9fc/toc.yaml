  docs/specs/forge/requirements/REQ-001_orchestrator_pattern.md:
    title: REQ-001 Orchestrator Pattern Requirements
    purpose: Specifies the orchestration, delegation, data-transfer, document-format, and completion-flow requirements for all user-invocable forge skills.
    content_details:
      - User-invocable skills act as orchestrators responsible for progress control, decisions, and user interaction
      - Detailed work is delegated to general-purpose or custom agents, while SKILL.md states what to delegate rather than execution details
      - Agent reference documents must be self-contained and stored in distributed runtime documentation, with skill-specific exceptions
      - Independent research and execution run in parallel, exchange results through return values, and avoid shared intermediate files
      - Prompts pass only structured arguments such as paths, types, and flags; agents read document and code bodies themselves
      - YAML is required for mechanically parsed and updated artifacts, while Markdown is used for expressive requirements and designs
      - Document-generating orchestrators complete review, specification ToC update when available, and commit confirmation
      - User command input is interpreted by AI; scripts are limited to structured YAML or JSON processing
