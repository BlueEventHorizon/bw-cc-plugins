    title: COMMON-DES-001 SKILL Base Design
    purpose: "Defines SKILL architecture and call patterns for bw-cc-plugins: inheritance-type SKILLs as default, fork-type SKILLs prohibited due to structural bugs, custom Agents for isolated contexts, and principles for argument passing"
