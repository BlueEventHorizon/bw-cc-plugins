  docs/specs/forge/design/ADR-065_review_backend_contract_completion.md:
    title: "ADR-065: Review Backend Contract Completion - Adding Failure, Termination Notice, and Location Information"
    purpose: "Extends the review backend contract with three missing elements: failure state representation, review termination notification, and location information format specification for findings, discovered during codex-appserver backend implementation"
    content_details:
      - "Context: ADR-060 introduced backend axis but noted contract had risk of being single implementation reflection"
      - Second backend (codex-appserver) revealed three contract gaps in practice
      - "Gap 1: No failure representation - output only has approved/findings, cannot signal backend failure"
      - "Gap 2: No review termination notification - no way to signal completion for resource cleanup"
      - "Gap 3: Undefined location information format - no specification for file path and line number representation in findings"
      - "msg-review background: failures and termination absorbed by human, resources owned by human so cleanup not needed"
      - "Decision: Add three elements to contract: three-value judgment (add failure), termination notification, location information specification"
      - "Root cause: Contract incomplete because only success path defined; implicit assumption someone absorbs failures/termination"
      - "Alternatives considered: use approved/zero findings for failure, process exit code, time-based resource reclamation, approved as termination signal, discard/guess/omit location, backend-specific fallback"
      - "Benefits: stateless backend can implement failure and cleanup in contract; unified handling across backends"
    applicable_tasks:
      - Review backend contract specification and extension
      - Failure state handling and error reporting in review flow
      - Resource lifecycle management for backend implementations
      - Location information extraction and validation from findings
      - Backend conformance verification for contract changes
