      - Direct reads outside Skill launch recover the active plugin path from process launch arguments
      - The SessionStart registration, repair script, unit tests, and repository ignore entry are removed
      - ADR-052 decisions on relative paths, external full paths, and style guidance remain valid
      - Existing symlinks and .gitignore lines in installed projects require manual cleanup described in release notes
