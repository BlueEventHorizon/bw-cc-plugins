      - "Fail-closed validation enforcement: unprocessed token detection, path absoluteness checks, target axis mutual exclusion, newline injection prevention"
      - "Scripts for deterministic processing: build_review_request.py (template embedding and validation), analyze_branch_point.py (base branch discovery), resolve_targets.py (path validation and allowlist generation), scan_secrets.py (deterministic secret detection with masking)"
      - "Trust boundary design: scan_secrets.py execution moved inside build_review_request.py for secrets pattern to prevent unmasked value exposure"
      - "Granularity preservation: directory specification does not expand to file lists in request body; validation prevents simultaneous file and directory targets"
