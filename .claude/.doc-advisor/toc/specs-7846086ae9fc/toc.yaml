      - "Axes A and B are deterministic reads: cmux command existence and direct Codex process confirmation via cmux top"
      - Axis C inference (shell prompt, Claude Code UI detection) unreliable when Codex process actively running
      - Screen reading for push wake-up safety gate maintained as separate concern
      - Local review pathway discontinued; independent backend with isolated context is better fallback
      - "Rejected alternatives: combined single script, axis C inclusion, maintaining unreached branches"
      - "Impact: deterministic failures confirmed before send, independent premise checks, no dead test paths"
