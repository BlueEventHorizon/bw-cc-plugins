  docs/specs/msg-review/design/ADR-061_msg_review_codex_wake_appserver_path.md:
    title: ADR-061 Codex Wake-up Path Multiplexing
    purpose: Architectural decision on providing push-type wake-up for resident Codex sessions, addressing cmux limitations through app-server path addition
    content_details:
      - msg-sys pull-model limitation causing Codex session stall
      - "Observed issues: 7-hour wait, round 2+ stops, 4 manual wake-ups per review"
      - Codex CLI app-server subcommand with listen modes (stdio, unix, ws)
      - WebSocket-over-UDS implementation using Python standard library
      - "Selection priority: app-server preferred for no input field corruption"
      - "Rejected alternatives: msg-sys requirement, replacement, external tools, MCP, daemon, proxy"
      - "Benefits: push wake-up without cmux, unnecessary safety gates removed, Codex-generated protocol definitions"
      - "Unverified assumptions: TUI remote connection behavior, socket type support"
      - "Decision expired: ADR-063 adopted independent backend approach"
