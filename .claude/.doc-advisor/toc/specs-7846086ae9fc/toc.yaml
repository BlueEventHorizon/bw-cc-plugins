      - "No auto-sync mechanism: full HTML regeneration on each write (triggered by agenda_store.py); users manually reload browser tabs"
      - HTML escaping via html.escape() for security; values read from agenda.json only (FNC-003 consistency guarantee)
      - Gutter-based change highlighting prevents visual noise compared to full-card background highlighting, compatible with severity badge display
      - "Test coverage: unit tests for data-driven rendering, manual verification of 'open' command functionality"
