    title: REQ-012 msg-review Review Backend Requirements
    purpose: Specifies requirements for synchronous review rounds between /forge:review and a persistent Codex session over msg-sys.
    content_details:
      - Availability checks independently validate wake capability, persistent peer session, and configuration without sending a request
      - Synchronous round execution combines wire-header insertion, sending, peer wake-up, waiting, and response parsing in one path
      - Round results are strictly approved, findings, or failure, with malformed declarations and missing finding metadata treated as failure
      - Wire protocol uses [msg-review] headers, review_id and round validation, plus in_reply_to chains for thread continuity
      - Timeouts are final failures with elapsed time, review_id, read state, and wake failure diagnostics; delayed replies never auto-resume
      - Optional history restoration reads existing msg-sys records without mutation or separate persistence
      - cmux wake-up is best-effort and reports sent, skipped, or failed while waiting continues
      - Python helpers must use only the standard library and include unit tests
