    title: DES-047 Review Core Fix Safety Guardrails Design
    purpose: Defines safety boundaries for applying confirmed review fixes through sequential edits, file allowlists, and deterministic syntax checks.
    content_details:
      - capture_syntax_baseline.py records preexisting syntax and formatting violations before confirmed fixes are applied
      - Each confirmed_fix is applied and verified independently rather than batching multiple findings
      - Repairs are limited to the finding and prohibit unrelated formatting changes or refactoring
      - verify_fix_safety.py reports modified files outside the target allowlist as allowlist_violations
      - Markdown, JSON, YAML, and TOML files are checked with dprint
      - Python files are checked with ast.parse without generating artifacts, and shell files with bash -n
      - Deleted and unsupported files are skipped with explicit reasons instead of producing errors
      - Safety scripts only detect and report; the review core decides rollback or justified propagation
      - collect_modified_files.py independently derives changed files from NUL-delimited git porcelain output at round end
      - Final verification allows only target_files plus explicitly justified propagation files and distinguishes violations from preexisting issues
