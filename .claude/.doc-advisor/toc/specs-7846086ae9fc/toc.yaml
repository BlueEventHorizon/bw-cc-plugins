      - build_review_request.py performs token replacement, absolute-path resolution, fail-closed validation, and JSON envelope generation
      - Secrets requests execute scan_secrets.scan inside build_review_request.py so unmasked external results cannot enter the request
      - Newline validation remains mandatory for trusted scan output to prevent Markdown structure and contract injection
      - Explicit-target templates require reviewers to enumerate directories, read every file fully, and avoid diff-review framing
      - Contract tests verify template coverage, backend neutrality, token consistency, reference existence, granularity preservation, and secret non-disclosure
