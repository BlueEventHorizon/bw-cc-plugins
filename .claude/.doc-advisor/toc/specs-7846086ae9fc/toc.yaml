    title: clean-rules Skill Design
    purpose: Defines workflow for /forge:clean-rules skill to analyze and restructure project rules directory, detect and remove duplicates with forge built-in docs, reorganize remaining documents based on development taxonomy
    content_details:
      - "Motivation: legacy rules disorganized with mixed concerns; forge docs in plugin cache are single source of truth to avoid dual management and version mismatches"
      - "Core principles: forge-provided content deleted from project rules (forge manages), project-defined rules protected, destructive operations use git stash safety net, staged execution (analysis-only default)"
      - "Four operation modes: default (analysis only), --delete (remove forge duplicate sections), --rebuild (restructure by taxonomy), --delete --rebuild (both operations)"
      - "Taxonomy classification: Content Type (Constraint/Convention/Format/Process/Decision/Reference) × Authority Source (Tool-provided/Project-defined/External standard)"
      - "Responsibility separation: forge provides Constraint review criteria and Format templates; projects define conventions, decisions, project-specific constraints"
      - "split_doc_sections.py preprocessor: breaks files into ## sections, structures as JSON with file/heading/text/line_number, no external APIs or embedding"
      - "Phase 1 (information collection): confirm .doc_structure.yaml, get rules list, fetch forge docs from rules_toc.yaml, pre-filter by keywords, read taxonomy.md"
      - "Phase 2 (AI analysis): classify each section by Content Type and Authority Source, identify forge correspondences, recommend delete/rebuild actions per mode"
      - "Phase 3 (safety): git stash if --delete or --rebuild specified, request per-category approval via AskUserQuestion"
      - "Phase 4-5 (execution): deletion/reconstruction with markdown syntax validation, .doc_structure.yaml auto-update, cross-reference updates, rules ToC refresh, commit confirmation, rollback instructions"
