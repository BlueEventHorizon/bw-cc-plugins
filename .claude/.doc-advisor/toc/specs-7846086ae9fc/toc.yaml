  docs/specs/forge/design/ADR-067_backend_availability_probe.md:
    title: "ADR-067: Add Backend Availability Probes and Resolve Defaults by Order"
    purpose: Defines side-effect-free backend availability probes and ordered default backend resolution before any review request is sent.
    content_details:
      - Every review backend must report whether it is available and identify each missing prerequisite
      - Availability decisions remain inside each backend so the review core receives results without knowing backend-specific conditions
      - Probes are read-only and must not send requests, consume reviewer turns, or create partial state
      - Without an explicit selection, the core probes candidates in order and chooses the first available backend
      - A command-line or .forge.yaml backend selection is authoritative and fails if unavailable rather than silently choosing another backend
      - Pre-send resolution differs from forbidden runtime fallback because selection completes before any request and is displayed in parsed arguments
      - Runtime failure never causes automatic migration to another backend
      - msg-review availability checks cmux wake capability and a resident Codex session without spending the ten-minute wait budget
      - History restoration was recorded here but later superseded by ADR-071 as an optional extension
    applicable_tasks:
