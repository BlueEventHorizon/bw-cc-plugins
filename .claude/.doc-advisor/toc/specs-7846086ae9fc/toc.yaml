  docs/specs/forge/design/ADR-073_no_capability_based_readonly_guarantee.md:
    title: ADR-073 No Capability-Based Read-Only Guarantee
    purpose: Explains why read-only properties of reviewers are not guaranteed through capability restrictions and violations are detected via git diff instead
    content_details:
      - "Initial approach: limiting reviewer capabilities through tool removal, plan mode, and role definition"
      - "Counterarguments: reviewer and body are same LLM with different permissions; reviewer must identify targets (--diff/--branch) requiring command execution; narrowing capability to read-only is impossible at tool level"
      - "Decision: remove read-only guarantee mechanisms; role definition, tool limits, and execution modes remain as prevention, not guarantees"
      - Violations detected via git diff which preserves changes but loses attribution between body modifications and reviewer changes
      - "Rejected alternative 1: removing bash tools (breaks target identification requirement)"
      - "Rejected alternative 2: path-based delta detection (failed - changing existing file doesn't change path set)"
      - "Rejected alternative 3: content-based identity checking (high false positives from external processes and exceptions)"
    applicable_tasks:
