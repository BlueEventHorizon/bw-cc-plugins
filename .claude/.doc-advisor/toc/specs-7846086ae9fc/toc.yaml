    title: msg-review Review Backend Design
    purpose: Specifies the design of msg-review, an inherited SKILL backend that synchronously completes review rounds with resident Codex sessions, handling setup checks, message wiring, sending, waiting, parsing, and notifications
    content_details:
      - Four operation modes (availability check, round execution, completion notification, history restoration)
      - Eight modules with division of labor (SKILL orchestration, availability probe, wrapper CLI, header processing, history filter, common parser, message infrastructure, thread extraction)
      - "Wire header format: [msg-review] <type> review_id=<id> round=<n>"
      - "Three-value judgment: approved, findings with severity (critical/major/minor), failure"
      - "Position tracking in findings: path+line or unknown=true, with warnings for missing positions"
      - Timeout handling with last observed state and wake failure diagnostics
      - History restoration via thread_filter and in_reply_to chain
      - Database messages with delivered_ids for delivery rights management
