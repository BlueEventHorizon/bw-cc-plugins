    title: DES-048 msg-review Codex Liveness Check and Local Review Path Design
    purpose: Specifies Codex liveness detection and fallback local review path for msg-review. Covers screen-based confirmation, reduced-timeout wait integration, claim/lease state tracking, and local review execution with safety verification.
    content_details:
      - Screen-based liveness confirmation script (check_codex_liveness.py) that analyzes cmux capture-pane output using heuristic rules to detect Claude Code UI or plain shell state
      - "Liveness detection rules (priority-ordered): capture command failure → Claude Code UI detection (2+ signals in last 5 lines) → plain shell prompt detection → default to live"
      - "Claude Code UI signals: auto mode on, shift+tab to cycle, Claude model tag format, context remaining percentage display"
      - "Integration with request mode: cmux pane discovery (Step 1.6), liveness check, request send → reduced-timeout wait (Step 6.6) on not_live"
      - Reduced wait timeout (90 seconds) for not_live case, with fallback to local review path only if timeout occurs after screen confirmation
      - "Mark_review_resolved.py state machine: claim in_progress before starting local review, transition to completed/failed, TTL-based automatic stale detection (10 minutes)"
      - "Receive mode integration: check review_id state before processing, hold in_progress cases, skip completed, treat stale as failed-equivalent"
      - "Local review execution: analyze review_criteria directly, apply intervention axis (DES-046) for auto-fix decisions, apply safety verification (DES-047)"
