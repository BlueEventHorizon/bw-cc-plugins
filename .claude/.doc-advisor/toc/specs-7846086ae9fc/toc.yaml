    title: DES-066 /forge:review Core Body Design
    purpose: Defines the backend-independent orchestration, backend resolution, request construction, finding handling, safety verification, and termination behavior of /forge:review.
    content_details:
      - Backend names resolve one-to-one to forge:<name> skills, with unknown or unavailable explicit selections failing closed
      - Default backend availability order is agent-review followed by msg-review, defined only in resolve_review_backend.py DEFAULT_ORDER
      - .claude/.forge.yaml review configuration accepts only an optional backend key and does not expose candidate ordering
      - analyze_branch_point.py confirms the base branch, while resolve_targets.py uses the same base to construct the modification allowlist
      - finalize_review.py centralizes approved, zero-confirmed-fix, failure, and interrupted termination paths and backend notifications
      - Review targets preserve range granularity in requests while separately expanding directories into safety allowlists
      - FOCUS and SCOPE remain separate request axes for review emphasis and completion criteria
      - Project rules and specs supplied by callers bypass duplicate searches, while only missing axes are queried
      - Fixes are applied and safety-checked per finding, followed by independent round-level modified-file verification
      - Subsequent rounds send only response mappings to context-preserving backends, but rebuild the full request for stateless backends
