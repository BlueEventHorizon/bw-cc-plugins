    title: "ADR-060: Review Execution Backend Axis Introduction"
    purpose: Introduces a pluggable backend system for review execution, replacing fixed single reviewer constraint with a --backend parameter to enable different review backends while maintaining a common interface
    content_details:
      - "Context: REQ-013 FNC-1307 previously fixed review execution to single Codex session backend"
      - "Problem: Different projects have different available execution backends available"
      - "Problem: Most SKILL logic is backend-independent (target resolution, granularity preservation, finding evaluation, safety verification)"
      - "Decision: Revert fixed execution backend and introduce --backend parameter (REQ-013 FNC-1318)"
      - "Key insight: Input/output boundary between backend-dependent and independent parts is already visible through contract"
      - "Finding format contract: All backends share common format (free markdown + severity markers + completion declaration)"
      - "Alternatives considered and rejected: forking, configuration files, separate SKILL per backend, variable format contracts"
      - "Benefits: projects without Codex support can use review flow; backend-dependent code isolated; contract validation with second backend"
      - "Constraints: backend name must be visible in output; unknown backends fail closed; no implicit fallback"
