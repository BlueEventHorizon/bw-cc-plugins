  docs/specs/forge/design/ADR-067_backend_availability_probe.md:
    title: "ADR-067: Add Availability Probing to the Contract and Resolve the Default Backend by Order"
    purpose: Records the superseded decision to require side-effect-free backend availability probes and select the first available default backend before sending a review request.
    content_details:
      - Availability probing is added as a backend contract request that returns usability and individually missing prerequisites
      - Probe logic remains inside each backend while the review orchestrator consumes only its result
      - Availability probes must be read-only, side-effect-free, inexpensive, and must not send review requests
      - Explicit CLI and .forge.yaml backend selections fail closed without choosing an alternative
      - Unspecified backends are resolved in candidate order before transmission, with all-unavailable results failing closed
      - Runtime failures never trigger fallback, preserving the prohibition established by ADR-060
      - History restoration is added to the backend contract alongside round execution and completion notification
      - msg-review and codex-appserver are identified as not yet conforming to availability and history-restoration requirements
      - ADR-067 was accepted on 2026-08-03 and superseded by ADR-071 on 2026-08-06
    applicable_tasks:
