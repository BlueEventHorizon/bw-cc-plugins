    title: msg-sys Codex Continuous Dialog Messaging Design (DES-034)
    purpose: Defines asynchronous messaging system architecture for bidirectional Claude-Codex communication via SQLite mailbox with Stop hooks, reply hints, and round-trip limits
    content_details:
      - SQLite WAL mailbox with append-only MESSAGES table, in_reply_to self-reference FK, and limit_notified_at column
      - Unified Python Stop hook check_inbox.py shared by Claude and Codex with FORGE_MSG_AGENT_NAME environment variable
      - "Reply hint format: safe CLI argument quoting via shlex.join(), stdin file redirection, three-step executable workflow"
      - Round-trip limiting via reply_chain_length() calculation and FORGE_MSG_MAX_ROUND_TRIPS environment variable
      - DB path resolution using git rev-parse --show-toplevel for project-independent execution from any working directory
      - "CLI modules: inbox.py with --next / --ack / --mark-notified, send.py with --in-reply-to / --db-path, history.py for audit"
      - Conditional-UPDATE rowcount validation in mailbox.ack() to prevent double-delivery on concurrent Stop hook processes
      - Human notification via lib/notify.py using subprocess array form for safe AppleScript escaping
      - "Error flow with 8-stage decision tree: FORGE_MSG_AGENT_NAME validation, db_path resolution, JSON parsing, sender validation, chain_length check, decision construction, ack, stdout write"
