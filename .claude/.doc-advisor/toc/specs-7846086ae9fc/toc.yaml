    title: REQ-013 Review Policy Requirements
    purpose: Defines the document-driven review policy, review axes, backend contract, findings handling, and secret-review safeguards for forge review.
    content_details:
      - Review detection is limited to P1 rule conformance, P2 contradictions, and P3 unjustified complexity; criteria-specific perspectives are prohibited
      - All reviewer judgments, severity mappings, and gray-zone allowances must be visible to authors in principles or rules at design time
      - "Target axes --diff, --branch, --files, and --dirs are mutually exclusive, default to --diff, and preserve the user's original granularity"
      - Interaction axes default to --interactive; --auto-critical fixes critical findings and --auto fixes critical plus major findings but never minor findings
      - "--focus adds a one-line emphasis without changing P1-P3 or severity, while --scope conveys the intended completion boundary"
      - Review backends are resolved before sending; explicit CLI or configuration choices fail closed, otherwise agent-review precedes msg-review
      - Backend contracts cover side-effect-free availability checks, round verdicts, finding locations, explicit failure, and mandatory termination notification
      - "--project-rules and --project-specs reuse caller-provided document paths and prevent duplicate searches"
      - Independent --secrets review scans the whole repository, combines deterministic and AI detection, never auto-fixes, and never reproduces secret values
      - Missing explicit rules become issues only when no SSOT rule exists, the problem is recurring or objective, and a concrete rule can be written
