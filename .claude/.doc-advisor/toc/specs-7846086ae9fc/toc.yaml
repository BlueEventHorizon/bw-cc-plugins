  docs/specs/forge/design/DES-022_parallel_agent_output_contract_design.md:
    title: Parallel Agent Output Contract Pattern Design
    purpose: Defines the output contract pattern for parallel Agent execution to prevent race conditions by requiring agents to return results via return value instead of shared resources or intermediate files
    content_details:
      - "Parallel write conflict problem: multiple agents writing to same shared file causes race conditions"
      - "Claude Code environment constraints: independent subprocess execution, no file locking, message passing only through Agent return value"
      - "Output contract scope: applies to orchestrator-agent result passing, not to writing behavior of writer agents"
      - "Basic principle: agents return results via return value, not shared resources; orchestrator keeps results in main context and writes artifacts once"
      - "Prohibition on intermediate files for result passing: avoid naming rules, collection, cleanup, and merge strategies"
      - "Agent responsibilities: return value delivery, self-contained results, unrestricted reads"
      - "Orchestrator responsibilities: wait for all agents, integrate return values, write artifacts, handle partial failures"
      - "Application examples: context collection in start-requirements, start-design, start-plan, start-implement"
      - "Antipatterns: shared file direct write, read-modify-write in agents, file locking, intermediate files for result passing"
      - "Checklist for designing parallel agents: return value delivery, no shared resource writes, wait for completion, partial failure handling, no intermediate files"
    applicable_tasks:
      - Designing parallel Agent orchestration patterns
      - Implementing result passing through return values
      - Preventing race conditions in concurrent execution
      - Establishing output contract for new Agent features
      - Reviewing Agent design for concurrency safety
    keywords:
