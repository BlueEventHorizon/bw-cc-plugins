      - "Fork-type SKILL issues: 95%+ fail rate, $ARGUMENTS unreachable, output loss, infinite recursion, false positive recursion guards"
      - "Internal SKILL call restrictions: inheritance-type SKILLs should not be internal workers unless parent context benefit is clear"
      - "Custom Agent system prompt design: negative tool constraints, argument interpretation guard, self-recursion prohibition, frontmatter allowlist"
      - "Static verification through test_no_fork_skill.py ensures no SKILL uses context: fork"
