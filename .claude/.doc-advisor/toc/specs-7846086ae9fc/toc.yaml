    title: "ADR-068: Restricting Availability Probe to Deterministic Judgments, Removing Screen-Based Liveness Detection"
    purpose: Defines decision to restrict availability probe to deterministic checks (cmux availability and Codex process presence), eliminating speculative screen-based judgments and local review fallback
    content_details:
      - ADR-067 requires backend availability probe; old DES-048 proposed screen-based Codex liveness inference (unimplemented)
      - "Conflicting specifications: ADR-067 blocks if unavailable vs. DES-048 always sends with short timeout"
      - Deterministic process checking via find_codex_pane.py (matches actual Codex binary on surface, not just pane existence)
      - Shell prompt and Claude Code UI detection rules are unreachable when Codex process is active
      - "Three-axis judgment separation: A) Wake-up means availability (cmux) - deterministic; B) Session residency (Codex process) - deterministic; C) Response capability - speculative"
      - Axes A and B included in availability probe; axis C excluded from prerequisite judgment (retained only for push wake-up safety gate)
      - "Individual prerequisite return: specify whether A or B is missing, not collapsed \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"unavailable\\\\\\\\\\\\\\\\"
      - Local review fallback path removed (same Claude self-review lacks independent perspective, fails to meet user expectation)
      - "Waiting shortening effect not achieved (residency confirmed deterministically; long waits from peer's own execution)"
      - "Alternative approaches rejected: combined single script (confuses certainty levels), including axis C in probe (false positives), reconstructing axis C rules (redundant with push wake-up detection)"
