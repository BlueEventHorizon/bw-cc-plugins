    title: DES-064 Codex-AppServer Review Backend Design
    purpose: Specifies the architecture and implementation design for a headless review backend running on codex app-server, handling request-response cycles with verdict and findings generation without direct human TUI interaction
    content_details:
      - "WebSocket client with RFC 6455 minimum implementation: handshake, masking, frame continuation, ping/pong, close (no TLS, compression, non-loopback)"
      - Server lifecycle management per review_id with endpoint and thread recording and reconnection validation
      - Thread start on initial round, resume on subsequent rounds, release on /forge:review termination notification
      - "Response event collection and conversion to common format: event sequence to text to verdicts with findings array"
      - Round-by-round audit logging of requests and responses in review-scoped directories
      - "Prerequisite checks before transmission: Codex CLI availability, app-server existence, required protocol methods"
      - "Orphan process handling: detection of stale processes from abnormal parent termination with user visibility"
      - "Fail-closed error handling: independent failure returns for missing prerequisites, startup failures, response parsing failures"
      - "Read-only permission mode: no write operations or approval requests in generated turns"
      - "Unattended operation advantage: no TUI dependency enabling complete automated integration testing"
