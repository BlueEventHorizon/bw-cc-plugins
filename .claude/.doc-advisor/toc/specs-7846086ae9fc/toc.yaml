  docs/specs/msg-review/design/ADR-061_msg_review_codex_wake_appserver_path.md:
    title: ADR-061 Multiplexing the Codex Wake Path with an App-Server Route
    purpose: Records the rejected proposal to add a Codex app-server push-wake route alongside cmux, its constraints, alternatives, and supersession by ADR-063.
    content_details:
      - Pull-based Stop hooks cannot wake an idle persistent Codex session, causing silent multi-round review stalls
      - Measured codex-cli 0.146.0 app-server capabilities, including turn/start, --remote, and WebSocket-over-UDS behavior
      - Rejected proposal to prefer app-server, fall back to cmux, and otherwise skip push wake-up
      - Python standard-library RFC 6455 client and Codex launch shim proposed without app-server daemon dependency
      - Configuration failures must warn instead of behaving like intentional disablement
      - Wake-up remains an application-layer responsibility and does not modify msg-sys requirements or implementation
      - Alternatives rejected include moving wake-up into msg-sys, replacing cmux, adopting agmsg, MCP, daemon, and proxy
      - ADR-063 supersedes the proposal by making app-server an independent review backend
      - Unverified assumptions about TUI --remote attachment and unix:// support remain unnecessary under ADR-063
      - ADR-061 numbering collision with DES-061 is intentionally retained to avoid renumbering impact
    applicable_tasks:
