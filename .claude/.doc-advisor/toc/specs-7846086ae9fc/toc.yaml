  docs/specs/forge/design/ADR-071_agent_review_default_backend.md:
    title: "ADR-071: Make Dependency-Free agent-review the First Default Backend"
    purpose: Defines agent-review as the first default review backend and revises shared backend boundaries for availability, history restoration, wire headers, and synchronous rounds.
    content_details:
      - Default backend order selects agent-review before msg-review when no backend is explicitly specified
      - Backend selection completes before sending and never switches after a round failure
      - Explicitly configured unavailable backends fail closed
      - Shared backend contract requires round execution, availability probing, and termination notification
      - History restoration becomes an optional extension limited to persistent backends such as msg-review
      - Interrupted stateless agent-review sessions restart with a new review_id instead of resuming
      - PROTOCOL_HEADER and the msg-review wire header are removed from the shared request body
      - msg-review adds and validates its protocol header internally immediately before sending
      - msg-review send, wake, wait, and response interpretation form one synchronous round boundary
      - Response timeout produces a final failure without automatically processing delayed replies
    applicable_tasks:
      - Selecting or configuring the default review backend
      - Implementing the shared review backend contract
      - Refactoring msg-review wire protocol handling
      - Designing review interruption and resumption behavior
      - Reviewing backend fallback and fail-closed semantics
