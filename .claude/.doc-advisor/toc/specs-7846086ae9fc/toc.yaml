    title: DES-046 Review Core Intervention Axis Design
    purpose: Defines how /forge:review classifies backend findings by severity into automatic-fix candidates and excluded findings.
    content_details:
      - Backend findings are limited by the shared parser contract to critical, major, and minor severities
      - Default, --interactive, and --auto all map to auto mode, where critical and major are automatic-fix candidates
      - "--auto-critical maps only critical findings to automatic-fix candidates and excludes major and minor"
      - gate_findings.py returns separate auto_fix and excluded arrays without confirming repairs
      - The review core validates each candidate against review criteria, actual target state, focus areas, and goals before confirmed_fix
      - Zero confirmed fixes terminates without requesting another review round
      - One or more confirmed fixes trigger repair, safety validation, and the next round under the same review_id
      - Findings with no confirmed fixes terminate as unresolved findings, distinct from approval
      - Invalid severities are defensively excluded, though the parser normally rejects missing severity as failure
      - Responsibility boundaries keep finding evaluation, repair, safety checks, and termination decisions in the review core
