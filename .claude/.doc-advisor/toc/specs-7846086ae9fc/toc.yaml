  docs/specs/doc-db/design/ADR-058_docdb_error_discrimination_contract.md:
    title: "ADR-058: Use Identifier Contracts for doc-db Error Discrimination and Require Version 0.3.3"
    purpose: Establishes contract-based discrimination of missing and trashed doc-db keys using error.data.code and sets doc-db 0.3.3 as the minimum supported version.
    content_details:
      - KEY_NOT_FOUND identifies a missing key or series for which index creation is permitted
      - KEY_TRASHED identifies a trashed key for which index creation is prohibited and restoration guidance is required
      - Error branching relies exclusively on the public error.data.code identifier contract
      - Message text and numeric JSON-RPC codes are explicitly excluded from branching decisions
      - doc-db version 0.3.3 or later is required, with no message-matching fallback for 0.3.2 and earlier
      - Errors without a recognized identifier remain operational failures and never trigger index creation
      - Contract-based discrimination prevents silent misclassification when doc-db message wording changes
      - The decision avoids destructive trash_index probing and limits recognized identifiers to two documented states
    applicable_tasks:
