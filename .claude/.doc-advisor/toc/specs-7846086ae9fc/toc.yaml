  docs/specs/consult/agenda/design/DES-075_agenda_mechanism_design.md:
    title: DES-075 Agenda Mechanism Design
    purpose: Design specification for agenda mechanism managing discussion item records, state transitions, and display generation; separates data persistence (agenda_store.py) and presentation (agenda_render.py) responsibilities with no external dependencies
    content_details:
      - "Two-layer architecture: data storage and display generation separated by agenda.json contract"
      - "Module design: agenda_store.py (CRUD, state transitions), agenda_render.py (HTML generation), agenda_schema.py (validation), __init__.py marker"
      - "Data schema: AgendaRecord with Config, Item, Decision, StructuralJudgment structures; status determined by presence/value of decision field only (no separate status vocabulary)"
      - "State transition requirements: decision recording requires background, essence, decision.by/outcome/reason; structural_judgment.recorded must be true before item transitions"
      - "CLI interface design: start (initialize), record (upsert items), next/pending (query), finish (cleanup with auto-deletion when all items decided)"
      - "Storage lifecycle: stored in .claude/.temp with key-specific organization (review fixed path, consult session-scoped); deletion triggered by decision completion, not by parent skill termination"
      - Automatic display regeneration after write operations to prevent stale HTML (triggered by agenda_store.py, not caller responsibility)
      - "Difference patch semantics: record command accepts partial JSON patches; structural_judgment at record level, item fields at item level"
      - "Caller-agnostic design: agenda accepts items without interpreting field meaning; consult/review provide context via identity derivation"
      - "Tested jointly: integration test verifies start → record × N → next/pending → finish workflow with concurrent display regeneration"
