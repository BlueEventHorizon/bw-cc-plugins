    title: DES-034 msg-sys Codex Continuous-Dialogue Messaging Design
    purpose: Defines asynchronous, persistent messaging between Claude and Codex sessions using a SQLite mailbox and symmetric Stop hooks.
    content_details:
      - SQLite WAL mailbox with append-only messages, unread state, reply chains, acknowledgements, and notification markers
      - Unified hooks/check_inbox.py controlled by FORGE_MSG_AGENT_NAME for Claude and Codex recipients
      - Fail-closed project-specific database resolution through --db-path or FORGE_MSG_PROJECT_ROOT
      - Atomic delivery-right acquisition through conditional unread-to-read acknowledgement updates
      - Executable reply hints using shlex-safe arguments, stdin redirection, and per-message temporary files
      - Round-trip limits through FORGE_MSG_MAX_ROUND_TRIPS and reply-chain length tracking
      - Human notification and limit_notified_at handling for held messages that exceed limits
      - Strict validation and continue-true failure behavior before acknowledgement
      - Explicit acceptance of message loss after acknowledgement if stdout delivery fails
      - Setup diagnostics, hook registration, concurrency risks, and comprehensive unit and integration tests
