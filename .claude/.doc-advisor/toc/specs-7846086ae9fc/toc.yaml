  docs/specs/forge/design/ADR-073_no_capability_based_readonly_guarantee.md:
    title: "ADR-073: Do not use capability-based design to guarantee reviewer read-only status"
    purpose: Explains the decision to not enforce reviewer read-only status through capability restrictions, instead relying on role definitions and git diff monitoring to detect any deviations
    content_details:
      - Reviewer Agent is same LLM as main execution agent
      - Reviewer must determine scope independently via command execution capability
      - Capability restrictions cannot distinguish read-only from modification commands
      - Removing command execution breaks scope determination for range-specific reviews
      - Previous post-round file comparison detection mechanism was ineffective
      - Changes by reviewer are captured as git diffs and never hidden
      - Role definitions, tool limitations, and execution mode restrictions as preventive measures
      - Scattered references to read-only guarantee were consolidated and removed
      - Deviation detection through git diff is sufficient without capability guarantees
