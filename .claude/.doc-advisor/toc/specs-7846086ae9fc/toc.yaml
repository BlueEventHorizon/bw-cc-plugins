    title: ADR-071 Make Dependency-Free agent-review the First Default Backend
    purpose: Defines backend selection, optional history restoration, protocol ownership, and synchronous round behavior for the review system.
    content_details:
      - Default backend order is agent-review followed by msg-review when no backend is specified
      - Backend selection completes before request dispatch and never switches after a round failure
      - Unavailable explicitly configured backends fail closed
      - Common backend contract includes round execution, availability probing, and termination notification
      - History restoration is an optional extension for persistent backends such as msg-review
      - Interrupted stateless reviews restart with a new review_id rather than resume
      - msg-review wire headers are removed from the common request body and owned internally by msg-review
      - Each msg-review round is one synchronous boundary from send through response interpretation
      - Timeout produces a final failure and delayed replies do not trigger automatic processing
