    title: Codex Continuous Dialogue Messaging Requirements
    purpose: Establishes infrastructure requirements for asynchronous message exchange between Claude and Codex sessions with stop hook integration, enabling autonomous inter-agent communication with continuation limits and self-contained reply instructions.
