  docs/specs/msg-review/design/DES-047_msg_review_fix_safety_guardrails_design.md:
    title: Fix Safety Guardrails Design
    purpose: Defines safety boundaries for applying confirmed_fix in the review process, including sequential per-finding application, target file allowlist enforcement, syntax validation, and independent change file confirmation
    content_details:
      - Baseline capture for syntax and format violations before applying fixes
      - Sequential application of fixes per finding (one at a time, never batched)
      - Allowlist validation against modified files to detect violations
      - Syntax validation for Markdown, JSON, YAML, TOML, Python, Shell with dprint and ast.parse
      - Distinction between pre-existing violations, new violations, unsupported extensions, and deleted files
      - Independent verification at round end using git porcelain output with NUL-delimited parsing
      - "Responsibility boundaries: backend returns finding arrays, review body decides and applies fixes"
      - "Three CLI scripts: capture_syntax_baseline.py, verify_fix_safety.py, collect_modified_files.py"
