      - FilterNotFoundError distinguishes non-applicable optional files from VersionDriftError version divergence
      - get_version_status.py separates base-file existence checks from version extraction and bump classification
      - update-version collects commit history before file updates, writes through adapters, inserts CHANGELOG entries, tests, then performs optional Git operations
