  docs/specs/common/design/ADR-056_document_reference_necessity_and_notation.md:
    title: ADR-056 Document Reference Necessity and Notation (Distribution Artifacts Excluded)
    purpose: Establishes guidelines for document references in project documentation, requiring necessity judgment before writing, prescribing markdown links for confirmed references, and excluding distribution artifacts from these rules
    content_details:
      - "Two reference use cases distinguished: discovery (finding unknown related documents) and reference to known documents (direct addressing)"
      - "Necessity principle: only write references when essential for understanding text; discovery is handled by query-docs SKILL"
      - Required references must use markdown link format [text](relative-path) to allow AI direct access without search
      - Metadata fields related_requirement and related_design record dependencies using IDs only (not links)
      - Distribution artifacts (plugins/) follow separate rules in forge document_style_guide.md and are exempt
      - "Context: collision resolved between ADR-052 (requiring links in distribution artifacts) and previous CLAUDE.md (prohibiting path references)"
      - "Impact: prevents unnecessary references that silently rot when reference targets are moved or deleted"
      - Unified spec format rules for all projects adopting forge apply consistency across reference notation
